erflow:hidden;position:relative;margin:12px 0 18px;background:radial-gradient(ellipse at 70% 60%,#17618b 0,transparent 28%),radial-gradient(circle at 68% 45%,#b7d9e8 0 8%,#5e9bb9 9% 13%,transparent 14%),linear-gradient(120deg,#07152a,#123b61 52%,#040d1c);box-shadow:0 0 35px #007dc755}.mission-hero:before{content:"";position:absolute;width:390px;height:390px;border-radius:50%;right:8%;top:30px;background:radial-gradient(circle at 35% 35%,#c9e9ff,#4585a8 42%,#173b5c 68%,#07192b 70%);box-shadow:inset -25px -18px 35px #020b1a,0 0 60px #44c9ff55}.mission-hero:after{content:"";position:absolute;left:38%;top:50%;width:55%;height:1px;transform:rotate(-17deg);background:#48d5ff;box-shadow:0 0 9px #38cfff}.hero-copy{position:relative;z-index:2;padding:24px;max-width:55%}.hero-copy strong{font-size:clamp(23px,3vw,36px);color:#fff}.hero-copy p{color:#c5e8ff}.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.hud>div{padding:12px;border:1px solid #2c709b;border-radius:12px;background:#061a30}.route-card{min-width:190px;flex:1}.route-card b{display:block;color:#dff7ff;font-size:16px}.alert{border:1px solid #ff6a61;background:linear-gradient(90deg,#541e2c,#2b1625);padding:12px 15px;border-radius:12px;color:#ffe1d8;box-shadow:0 0 20px #ff4c4c33}.flight-scene{height:260px;border-radius:18px;overflow:hidden;position:relative;border:1px solid #2787ba;background:radial-gradient(circle at 70% 40%,#1e547e,#071a33 45%,#020812);margin:12px 0}.flight-scene:before{content:"";position:absolute;width:210px;height:210px;right:9%;top:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6f4ff,#679fbd 48%,#183e61 70%);box-shadow:inset -20px -15px 28px #020b18,0 0 40px #5bd7ff55}.ship{position:absolute;left:36%;top:45%;font-size:58px;filter:drop-shadow(0 0 16px #49d9ff);transform:rotate(-25deg)}.orbit{position:absolute;left:15%;top:15%;width:65%;height:75%;border:2px dashed #25caff;border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 12px #14aa button{touch-action:manipulation;min-height:42px}.flight-scene{touch-action:pan-y}.flight-scene .ship{will-change:left,top,transform}@media(max-width:650px){#app{padding:10px}.mission-hero:before{right:-20%;opacity:.65}.hero-copy{max-width:78%}.cd{padding:12px}.flight-scene{height:210px}}

const f=(x,n=1)=>(+x).toFixed(n),R=Math.random;
const D=[
{k:'luna',n:'Luna',e:'🌙',c:50,en:1,sol:1,cf:1,t:10,tol:1.2,dl:'1,3 s',so:1,at:0,lg:0,nt:'Cerca y barata: ideal para aprender.'},
{k:'venus',n:'Venus',e:'🟡',c:150,en:2,sol:.9,cf:2,t:14,tol:.8,dl:'2–14 min',so:1,at:1,lg:0,nt:'Atmósfera densa y calor extremo.'},
{k:'marte',n:'Marte',e:'🔴',c:180,en:2.2,sol:.43,cf:3,t:14,tol:.9,dl:'3–22 min',so:1,at:1,lg:0,nt:'El equilibrio entre costo y ciencia.'},
{k:'bennu',n:'Asteroide Bennu',e:'☄️',c:130,en:2.5,sol:.35,cf:3,t:12,tol:.6,dl:'unos 10 min',so:1,at:0,lg:0,nt:'Gravedad mínima: cuesta precisar la inserción.'},
{k:'europa',n:'Europa (Júpiter)',e:'🧊',c:320,en:3.5,sol:.04,cf:5,t:22,tol:.7,dl:'35–52 min',so:1,at:0,lg:1,nt:'Océano bajo el hielo y radiación brutal. Pide RTG.'},
{k:'titan',n:'Titán (Saturno)',e:'🪐',c:380,en:4,sol:.01,cf:6,t:24,tol:.7,dl:'70–85 min',so:1,at:1,lg:1,nt:'Lagos de metano. Casi sin luz solar.'},
{k:'nept',n:'Neptuno',e:'🔵',c:400,en:5,sol:.001,cf:8,t:26,tol:.6,dl:'unas 4 h',so:0,at:1,lg:1,nt:'Gigante helado, sin superficie. Solo en fácil o sandbox.'}];
const OR={low:{n:'Órbita baja',c:0,e:1,s:.9,tol:1,i:'Barata, buena señal, ciencia limitada.'},pol:{n:'Órbita polar',c:20,e:1.1,s:1.15,tol:.9,i:'Cubre todo el cuerpo; lanzar cuesta más.'},ell:{n:'Órbita elíptica',c:10,e:.95,s:1,tol:1.1,i:'Compromiso: más fácil de insertar.'},land:{n:'Aterrizaje',c:40,e:1.25,s:1.4,tol:.7,i:'Habilita equipo de superficie; mucho más difícil.'}};
const DU=[{n:'6 meses',c:0,m:.7},{n:'12 meses',c:15,m:1},{n:'24 meses',c:35,m:1.4}];
const RK={tron:{n:'Tronador II (Argentina)',c:80,cap:8,fu:5,pr:.2},f9:{n:'Falcon 9 reutilizable',c:150,cap:20,fu:8,pr:.1},sat:{n:'Saturn V',c:200,cap:34,fu:10,pr:.08},sls:{n:'Space Launch System',c:240,cap:45,fu:12,pr:.07}};
const BUS={s:{n:'Bus simple',c:25,m:1.5,p:1,b:1},a:{n:'Bus avanzado (+10 % ciencia)',c:60,m:2.5,p:1.2,b:1.1}};
const IT=[['panel','nave','Panel solar',25,.6,0,3,0,0,0,3],['rtg','nave','RTG nuclear',90,1.2,0,2,0,0,0,2],['antb','nave','Antena básica',20,.3,.5,0,0,3,0,1],['anta','nave','Antena de alta ganancia',50,.8,1.5,0,0,8,0,1],['ia','nave','IA de a bordo (−30 % datos)',40,.2,.5,0,0,0,0,1],['sh','nave','Blindaje de radiación',50,1,0,0,0,0,0,1],['hab','nave','Hábitat inflable NextSTEP',70,2,1.5,0,0,0,0,1],['cry','nave','Cápsula criogénica',60,1.5,1,0,0,0,0,1],
['cam','sci','Cámara óptica',40,.5,.5,0,3,0,8,1],['uv','sci','Cámara UV',60,.6,.8,0,4,0,12,1],['esp','sci','Espectrómetro',70,.8,1,0,3,0,16,1],['rad','sci','Radar de subsuelo',90,1.2,2,0,6,0,22,1],['mag','sci','Magnetómetro',35,.3,.3,0,1,0,6,1],
['jet','sup','Jetpack (requiere tripulación)',40,.4,.2,0,0,0,5,1],['dro','sup','Dron tipo Ingenuity (solo con atmósfera)',70,.5,.5,0,2,0,10,1],['bug','sup','Buggy',90,1,1,0,3,0,12,1],['rov','sup','Rover tipo Perseverance',150,2.5,2,0,5,0,24,1],['and','sup','Androide',200,1.8,1.5,0,4,0,28,1],
['pil','crew','Piloto (+30 % margen de inserción)',20,.2,.2,0,0,0,0,1],['med','crew','Médico',30,.2,.2,0,0,0,0,1],['mec','crew','Mecánico',20,.2,.2,0,0,0,0,1],['ing','crew','Ingeniero',30,.2,.2,0,0,0,0,1],['bio','crew','Astrobiólogo (+20 % ciencia)',40,.2,.2,0,0,0,0,1]].map(a=>({id:a[0],cat:a[1],n:a[2],c:a[3],m:a[4],p:a[5],g:a[6],d:a[7],r:a[8],s:a[9],mx:a[10]}));
const ROUTES={auto:{n:'Ruta automática',c:0,risk:'Variable',desc:'El sistema compara riesgo, costo y obstáculos y selecciona una ruta durante el vuelo.'},safe:{n:'Ruta segura',c:35,risk:'Bajo',desc:'Más larga, evita zonas densas y reserva combustible.'},fast:{n:'Ruta rápida',c:0,risk:'Alto',desc:'Menor duración, más exposición a obstáculos.'},science:{n:'Ruta científica',c:55,risk:'Medio',desc:'Sobrevuelo de interés: suma oportunidades de medición.'}};
const ROL=['Planificador','Ingeniero','Científico','Logística'],BUDS=[1800,2400,3200],DIF=['Fácil','Normal','Experto'];
// Presupuesto base ampliado para que la experimentación y la resolución de incidentes sean viables.
const TRAVEL={luna:{min:.363,max:.406,sec:28},venus:{min:38,max:261,sec:95},marte:{min:55,max:401,sec:120},bennu:{min:15,max:300,sec:145},europa:{min:588,max:968,sec:255},titan:{min:1200,max:1700,sec:340},nept:{min:4300,max:4700,sec:480}};
const fmtDist=x=>x<1?`${Math.round(x*1000).toLocaleString('es-AR')} mil km`:`${Math.round(x).toLocaleString('es-AR')} millones de km`;
const HAZARDS={
luna:[['micrometeoritos','desvío corto, blindaje o asumir el impacto'],['polvo lunar electrostático','apagar sensores expuestos, cambiar altura o continuar'],['zona de cráteres','rodear el terreno o corregir el punto de descenso']],
venus:[['pico de temperatura','aislar sistemas, reducir consumo o atravesar la zona'],['nube corrosiva','blindaje químico, desvío o asumir daño'],['turbulencia atmosférica','corregir ángulo de entrada o esperar una ventana']],
marte:[['tormenta de polvo','proteger paneles, cambiar altura o continuar'],['micrometeoritos','blindaje, desvío o asumir impacto'],['campo de asteroides','corrección de rumbo o ruta alternativa']],
bennu:[['fragmentos de regolito','alejarse de la superficie o activar propulsores'],['rotación irregular del asteroide','recalcular aproximación o mantener distancia'],['eyección de partículas','blindaje o maniobra evasiva']],
europa:[['cinturón de radiación de Júpiter','blindaje, apagar instrumentos o rodear la zona'],['pluma de vapor de agua','desvío corto o atravesar con protección'],['perturbación gravitatoria','recalcular trayectoria o gastar combustible en corrección']],
titan:[['tormenta de metano','sellar sistemas y cambiar altura'],['frío extremo','activar calefacción o reducir instrumentos'],['niebla densa de hidrocarburos','usar radar y corregir aproximación']],
nept:[['vientos supersónicos','cambiar ángulo de aproximación o abortar descenso'],['tormenta atmosférica','proteger instrumentos o rodear el frente'],['presión atmosférica extrema','mantener órbita segura y no descender']]};

function travelFor(d){const t=TRAVEL[d.k]||TRAVEL.marte;return {...t,distance:d.distNow||t.min+Math.random()*(t.max-t.min)}}
// Datos reales (NASA/JPL): /api/live-data en Vercel, o el snapshot assets/live-data.js como respaldo.
let LIVE={src:'ref',gen:null,sw:null};
const BONUS={luna:0,venus:70,marte:100,bennu:90,europa:220,titan:280,nept:340,neo:90};
// Dificultad energética derivada del v∞ real (JPL Mission Design). 5,5 km/s = suma de referencia del juego.
const enFromVinf=(base,m)=>+(base*Math.max(.85,Math.min(1.25,(m.vinf_dep+m.vinf_arr)/5.5))).toFixed(2);
const fechaAR=iso=>{const p=String(iso||'').slice(0,10).split('-');return p.length==3?`${p[2]}/${p[1]}/${p[0]}`:iso};
const swEvent=sw=>sw.max_kp>=5&&(sw.max_kp>=6||!sw.max_flare)?`la tormenta geomagnética Kp ${sw.max_kp} del ${fechaAR(sw.max_kp_time)}`:sw.max_flare?`la fulguración ${sw.max_flare.class} del ${fechaAR(sw.max_flare.date)}`:'la actividad solar registrada';
function applyLive(L,src){if(!L||!L.bodies||!Object.keys(L.bodies).length)return;const g=(L.generated||'').slice(0,10);
 D.forEach(d=>{const b=L.bodies[d.k];if(!b)return;d.live=g;if(b.delay_txt)d.dl=b.delay_txt;if(b.dist_now_km)d.distNow=b.dist_now_km/1e6;if(b.dist_min_km&&TRAVEL[d.k])TRAVEL[d.k]={...TRAVEL[d.k],min:b.dist_min_km/1e6,max:b.dist_max_km/1e6}});
 const bn=D.find(x=>x.k=='bennu'),md=L.mission_design&&L.mission_design.bennu;if(bn&&md){bn.md=md;bn.en=enFromVinf(2.5,md)}
 const N=L.neo;if(N&&N.mission){const i=D.findIndex(x=>x.k=='neo');if(i>=0)D.splice(i,1);const dist=N.miss_km/1e6,lt=N.miss_km/299792.458;
  D.push({k:'neo',n:'Asteroide '+N.name,e:'🪨',c:140,en:enFromVinf(2.5,N.mission),sol:.35,cf:3,t:12,tol:.6,dl:lt<60?Math.round(lt)+' s':Math.round(lt/60)+' min',so:1,at:0,lg:0,live:g,distNow:dist,md:N.mission,
   nt:`Asteroide real de esta semana (NASA NeoWs): unos ${N.diam_m.toLocaleString('es-AR')} m, ${N.hazardous?'potencialmente peligroso':'no peligroso'}, pasa cerca de la Tierra el ${fechaAR(N.approach_date)} a ${f(N.vel_kms,1)} km/s.`});
  TRAVEL.neo={min:dist,max:dist,sec:145};HAZARDS.neo=HAZARDS.bennu}
 if(L.space_weather)LIVE.sw=L.space_weather;LIVE.src=src;LIVE.gen=g}
const srcTxt=()=>LIVE.src=='live'?`en vivo de NASA/JPL (${fechaAR(LIVE.gen)})`:LIVE.src=='snapshot'?`copia guardada de NASA/JPL del ${fechaAR(LIVE.gen)}`:'valores de referencia (sin conexión a NASA)';
const TABS=[['Destino',0],['Órbita y tiempo',0],['Cohete',1],['Nave',1],['Ciencia',2],['Superficie y equipo',3]];
let S={n:1,act:0,diff:1,sand:false,dest:'luna',orb:'low',dur:1,route:'auto',rk:'tron',bus:'s',q:{},tab:0,ph:'plan',rd:[],fl:null,rep:null};
const gd=()=>D.find(x=>x.k==S.dest),can=()=>S.n==1||TABS[S.tab][1]%S.n==S.act;
function set(o){if(!can()&&!('n' in o||'diff' in o||'sand' in o))return;Object.assign(S,o);S.rd=[];draw()}
function go(o){Object.assign(S,o);draw()}
function qt(id,d){if(!can())return;const i=IT.find(x=>x.id==id);S.q[id]=Math.max(0,Math.min(i.mx,(S.q[id]||0)+d));S.rd=[];draw()}
function calc(){const d=gd(),o=OR[S.orb],r=RK[S.rk],b=BUS[S.bus],du=DU[S.dur],q=id=>S.q[id]||0;
let c=d.c+o.c+r.c+b.c+du.c+ROUTES[S.route].c,m=b.m,pu=b.p,pg=0,dt=0,rt=0,sc=0,cr=0;
IT.forEach(i=>{const n=q(i.id);if(!n)return;c+=n*i.c;m+=n*i.m;pu+=n*i.p;pg+=n*i.g*(i.id=='rtg'?1:d.sol);dt+=n*i.d;rt+=n*i.r;if(i.cat=='crew')cr+=n;if(i.cat=='sci'||(i.cat=='sup'&&S.orb=='land'))sc+=n*i.s});
if(q('ia'))dt*=.7;
return{d,o,r,b,du,q,c,m,pu,pg,dt,cr,cap:r.cap/(d.en*o.e),dc:rt*10/d.cf,bud:S.sand?9999:Math.round(BUDS[S.diff]+(BONUS[S.dest]||0)),sc:sc*o.s*b.b*du.m*(q('bio')?1.2:1)}}
function checks(k){const{d,q}=k,L=[],a=(ok,t,w)=>L.push([ok,t,w]);
a(k.c<=k.bud,`Presupuesto: ${k.c} de ${k.bud} créditos`,'Si te pasás, cancelan el proyecto. Recortá algo.');
a(k.m<=k.cap,`Masa: ${f(k.m)} t de ${f(k.cap)} t que levanta el cohete`,'La capacidad baja cuanto más energía exige el destino y la órbita.');
a(k.pg>=k.pu,`Energía: genera ${f(k.pg)} kW y consume ${f(k.pu)} kW`,'Lejos del Sol los paneles rinden poco: ahí conviene un RTG.');
a(k.dt<=k.dc,`Datos: ${f(k.dt)} generados, ${f(k.dc)} transmisibles`,'A más distancia, menos ancho de banda. Ayudan una antena mejor o la IA.');
a(q('antb')+q('anta')>0,'Comunicaciones: hay antena','Sin antena no hay manera de bajar la ciencia a la Tierra.');
a(IT.some(i=>i.cat=='sci'&&q(i.id)),'Hay al menos un instrumento científico','Sin instrumentos no hay ciencia que reportar.');
if(k.cr)a(q('hab')>0,'Tripulación con hábitat a bordo','Las personas necesitan un lugar donde vivir.');
if(k.cr&&d.lg)a(q('cry')>0,'Viaje largo con tripulación: cápsula criogénica','El viaje dura años y la tripulación necesita soporte.');
const sup=IT.filter(i=>i.cat=='sup'&&q(i.id));
if(sup.length)a(S.orb=='land'&&d.so,'Equipo de superficie: se puede aterrizar','El equipo de superficie requiere elegir “Aterrizaje” en un cuerpo con superficie.');
if(S.orb=='land')a(!!d.so,'Este cuerpo tiene superficie','Neptuno es un gigante de gas: solo se lo puede orbitar.');
if(q('dro'))a(!!d.at,'Dron: el destino tiene atmósfera','Un dron necesita aire para volar.');
if(q('jet'))a(k.cr>0,'Jetpack: hay tripulación para usarlo','Alguien tiene que llevarlo puesto.');
return L}
function bar(l,v,mx,t,inv){const p=mx>0?v/mx:1,bad=inv?false:p>1;return`<div><div class="s">${l}: ${t}</div><div class="bar ${bad?'x':''}"><i style="width:${Math.min(100,p*100)}%"></i></div></div>`}
function dash(k){return`<div class="cd g">${bar('Presupuesto',k.c,k.bud,k.c+' / '+(S.sand?'∞':k.bud)+' cr')}${bar('Masa',k.m,k.cap,f(k.m)+' / '+f(k.cap)+' t')}${bar('Energía',k.pu,Math.max(k.pg,.01),f(k.pu)+' / '+f(k.pg)+' kW')}${bar('Datos',k.dt,Math.max(k.dc,.01),f(k.dt)+' / '+f(k.dc))}${bar('Ciencia',k.sc,k.d.t,f(k.sc)+' / objetivo '+k.d.t,1)}</div>`}
function ch(on,fn,t,s){return`<button class="${on?'on':''}" onclick="${fn}"${can()?'':' disabled'}><b>${t}</b><br><span class="s">${s}</span></button>`}

<div id="arrival-panel" class="cd" style="display:${F.arrival?'block':'none'}"><div class="alert"><b>¡Llegaste a ${k.d.n}!</b><br>La nave continúa desplazándose. Ajustá el rumbo y entrá en la ventana de inserción.</div><button class="p" onclick="${S.orb==='land'&&k.d.so?'landNow()':'ins()'}">${S.orb==='land'&&k.d.so?'Iniciar descenso y aterrizaje':'Ejecutar inserción orbital'}</button></div>${F.obs&&F.obs[1]?`<div class="cd"><div class="alert"><b>⚠ ALERTA ANTICIPADA: ${F.obs[0]}</b><br>Elegí una respuesta; el vuelo continúa.</div><div class="row"><button onclick="reactObstacle('reroute')">↗ Desviar trayectoria</button><button onclick="reactObstacle('shield')">⬡ Activar blindaje</button><button onclick="reactObstacle('continue')">Continuar y asumir riesgo</button></div></div>`:''}<div class="cd"><b>Registro de vuelo</b><div id="flight-log">${F.log.slice(-5).map(l=>`<div>${l}</div>`).join('')}</div></div>`}
function holdKey(key,on){if(S.fl&&S.ph==='fly'){S.fl.keys=S.fl.keys||{};S.fl.keys[key]=on}}
function changeRoute(key){if(!S.fl||S.ph!=='fly')return;S.fl.route=key;S.fl.routeTarget=key==='safe'?47:key==='fast'?61:key==='science'?53:50;S.fl.log.push('Trayectoria modificada: '+ROUTES[key].n+'. La nave mantiene su velocidad y se dirige al nuevo corredor.');draw()}
function landNow(){if(!S.fl||!S.fl.arrival)return;S.fl.landed=true;S.fl.log.push('Aterrizaje confirmado: la nave se detiene al tocar la superficie del destino.');ins()}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&S.ph==='fly'){e.preventDefault();holdKey(e.key,true)}});window.addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))holdKey(e.key,false)});window.addEventListener('blur',()=>{if(S.fl)S.fl.keys={}});
function rep(){const r=S.rep,k=calc();
return`<h1>${r.ok?'Misión cumplida':'Misión fallida'}: ${k.d.e} ${k.d.n}</h1><div class="cd"><b class="${r.ok?'ok':'no'}">${r.ok?`Puntaje ${r.score} · ${'★'.repeat(r.st)}${'☆'.repeat(3-r.st)}`:'Se perdió la inversión: '+k.c+' créditos'}</b>${r.ok?'<div class="s">Estrellas: inserción lograda, ciencia al 100 % del objetivo, reserva de 50 cr o más.</div>':''}<h3>Qué pasó y por qué</h3>${r.why.map(w=>`<div>${w}</div>`).join('')}${r.top?`<h3>Mejores puntajes en este dispositivo</h3>${r.top.map(t=>`<div class="s">${t.s} pts · ${t.d}</div>`).join('')}`:''}<div class="row" style="margin-top:10px"><button class="p" onclick="go({ph:'plan',rep:null,fl:null})">Rediseñar y volver a simular</button></div></div>`}
function draw(){document.getElementById('app').innerHTML=S.ph=='plan'?plan():S.ph=='fly'?fly():rep()}
if(window.LIVE_DATA)applyLive(window.LIVE_DATA,'snapshot');
draw();
if(location.protocol.startsWith('http')){const ac=new AbortController();setTimeout(()=>ac.abort(),8000);
 fetch('api/live-data',{signal:ac.signal}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(L=>{applyLive(L,'live');if(S.ph==='plan')draw()}).catch(()=>{})}
</script></body></html>
